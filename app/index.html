<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#1e4a34" />
  <title>Atreemology — grow your vocabulary forest</title>
  <meta name="description" content="Atreemology teaches English word roots by growing a personal vocabulary forest, one root family at a time." />

  <!-- App icons. icon.svg is the scalable source; the PNGs below cover
       browsers/OSes (notably Safari and Android home-screen shortcuts)
       that don't support SVG favicons. Paths are absolute (/icons/...),
       so they resolve correctly whether this page is served from /app/
       or anywhere else. -->
  <link rel="icon" href="/icons/icon-512.png" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- "Add to Home Screen" on iOS reads these directly, independent of
       manifest.json (Safari's manifest support is partial). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Atreemology" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Link-preview cards (iMessage, WhatsApp, Instagram, Slack, etc.).
       og:url now points at /app/ specifically, since that's this page's
       real deployed location — the marketing homepage at the bare apex
       has its own separate preview tags. -->

  <meta property="og:title" content="Atreemology — grow your vocabulary forest" />
  <meta property="og:description" content="Learn English word roots by growing a personal vocabulary forest, one root family at a time." />
