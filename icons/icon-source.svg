  <line x1="14" y1="58" x2="86" y2="58" stroke="#3a4434" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <!-- roots, below ground: fanning taproots with rounded tips, echoing the in-app tree component -->
