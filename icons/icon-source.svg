  <circle cx="38" cy="80" r="3.2" fill="#dcefe0"/>
  <circle cx="62" cy="80" r="3.2" fill="#dcefe0"/>
  <circle cx="50" cy="84" r="3.2" fill="#dcefe0"/>
  <!-- trunk, above ground -->
  <path d="M46 58 C45 48, 45 40, 47 32 L53 32 C55 40, 55 48, 54 58 Z" fill="#7c5b43"/>
  <!-- canopy: layered rounded lobes, above ground -->
  <circle cx="50" cy="26" r="19" fill="#3fa06a"/>
  <circle cx="35" cy="34" r="13" fill="#4fb87e"/>
  <circle cx="65" cy="34" r="13" fill="#4fb87e"/>
