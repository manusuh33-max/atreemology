<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3d2c" />
  <title>Etymon — grow your vocabulary forest</title>
  <meta name="description" content="Etymon teaches English word roots by growing a personal vocabulary forest, one root family at a time." />

  <!-- App icons. icon.svg is the scalable source; the PNGs below cover
       browsers/OSes (notably Safari and Android home-screen shortcuts)
       that don't support SVG favicons. -->
  <link rel="icon" href="/icons/icon-512.png" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- "Add to Home Screen" on iOS reads these directly, independent of
       manifest.json (Safari's manifest support is partial). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Etymon" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Link-preview cards (iMessage, WhatsApp, Instagram, Slack, etc.).
       og:url and og:image are written as absolute placeholders — swap
       yourdomain.example for the real address once this is deployed, or
       the previews will point at nothing. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Etymon — grow your vocabulary forest" />
  <meta property="og:description" content="Learn English word roots by growing a personal vocabulary forest, one root family at a time." />
  <meta property="og:url" content="https://yourdomain.example/" />
  <meta property="og:image" content="https://yourdomain.example/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Etymon — grow your vocabulary forest" />
  <meta name="twitter:description" content="Learn English word roots by growing a personal vocabulary forest, one root family at a time." />
  <meta name="twitter:image" content="https://yourdomain.example/icons/icon-512.png" />

  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
